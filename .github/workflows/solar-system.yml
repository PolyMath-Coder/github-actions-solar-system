name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/*"

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache NPM Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      # - name: Unit Testing
      #   run: npm test

      # - name: Archive Test Result
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Mocha-Test-Result
      #     path: test-results.xml
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

  dev-deploy:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install KubeCTL CLI
        uses: azure/setup-kubectl@v3
        with:
          version: "v.1.26.0"

      - name: Fetch Kubernetes cluster details
        run: |
          kubectl version --short
          echo ---------------
            kubectl get nodes

      # - name: Set up SSH
      #   uses: webfactory/ssh-agent@v0.7.0
      #   with:
      #     ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # - name: Deploy to Development Server
      #   run: |
      #     ssh -o StrictHostKeyChecking=no user@dev-server "docker pull ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }} && docker stop solar-system || true && docker rm solar-system || true && docker run -d --name solar-system -p 3000:3000 ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"
